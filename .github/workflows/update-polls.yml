name: Atualizar pesquisas

on:
  schedule:
    # 07h17, 12h17, 16h17 e 21h17 em Brasília (UTC-3).
    - cron: "17 0,10,15,19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: update-polls
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Sincronizar catálogo do TSE
        id: sync
        run: >-
          python scripts/sync_tse.py
          --summary-dir "$RUNNER_TEMP/pending"
          --issue-manifest "$RUNNER_TEMP/issues.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Descobrir resultados divulgados publicamente
        id: discover
        run: >-
          python scripts/discover_results.py
          --summary "$RUNNER_TEMP/result-discovery.md"
          --github-output "$GITHUB_OUTPUT"

      - name: Incorporar resultados confirmados automaticamente
        id: ingest
        run: python scripts/ingest_results.py --lookback-days 12

      - name: Validar dados antes de publicar
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_data.py
          node --check app.js

      - name: Registrar atualização na main
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- 'data/polls*.json' 'data/tse-metadata*.json' 'data/tse-monitor*.json' 'data/result-discovery.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "pulso26-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'data/polls*.json' 'data/tse-metadata*.json' 'data/tse-monitor*.json' 'data/result-discovery.json'
          git commit -m "chore: atualiza monitor de pesquisas"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Solicitar publicação no GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          -H "Accept: application/vnd.github+json"
          -H "X-GitHub-Api-Version: 2026-03-10"
          "repos/$GITHUB_REPOSITORY/pages/builds"

      - name: Atualizar filas editoriais
        if: steps.sync.outputs.queue_changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.elections[] | select(.queueChanged == true)' "$RUNNER_TEMP/issues.json" | while IFS= read -r item; do
            issue_title=$(jq -r '.issueTitle' <<< "$item")
            pending_count=$(jq -r '.pendingCount' <<< "$item")
            summary_file=$(jq -r '.summaryFile' <<< "$item")
            issue_number=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" | jq -r --arg title "$issue_title" '.[] | select((has("pull_request") | not) and .title == $title) | .number' | head -n1)
            if [ "$pending_count" = "0" ]; then
              if [ -n "$issue_number" ]; then
                gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments" -f body="Todos os protocolos detectados já foram revisados."
                gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$issue_number" -f state=closed
              fi
            elif [ -n "$issue_number" ]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$issue_number" -F "body=@$summary_file"
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/issues" -f title="$issue_title" -F "body=@$summary_file"
            fi
          done

      - name: Atualizar fila de fontes públicas
        if: steps.discover.outputs.queue_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "[Resultados] Fontes encontradas automaticamente"
        run: |
          pending_count='${{ steps.discover.outputs.pending_count }}'
          summary_file="$RUNNER_TEMP/result-discovery.md"
          issue_number=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" | jq -r --arg title "$ISSUE_TITLE" '.[] | select((has("pull_request") | not) and .title == $title) | .number' | head -n1)
          if [ "$pending_count" = "0" ]; then
            if [ -n "$issue_number" ]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments" -f body="Todas as fontes encontradas já foram revisadas."
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$issue_number" -f state=closed
            fi
          elif [ -n "$issue_number" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$issue_number" -F "body=@$summary_file"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues" -f title="$ISSUE_TITLE" -F "body=@$summary_file"
          fi
